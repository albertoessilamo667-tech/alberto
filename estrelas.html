<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuva de Estrelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #020617;
}

.ceu {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#020617, #0f172a);
}

.estrela {
    position: absolute;
    top: -20px;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white;
    animation: queda 3s linear infinite;
}


.estrela:nth-child(1) {
    left: 5%;
    animation-delay: 0s;
}

.estrela:nth-child(2) {
    left: 12%;
    animation-delay: 1s;
}

.estrela:nth-child(3) {
    left: 20%;
    animation-delay: 2s;
}

.estrela:nth-child(4) {
    left: 28%;
    animation-delay: 0.5s;
}

.estrela:nth-child(5) {
    left: 36%;
    animation-delay: 1.5s;
}

.estrela:nth-child(6) {
    left: 44%;
    animation-delay: 2.5s;
}

.estrela:nth-child(7) {
    left: 52%;
    animation-delay: 0.8s;
}

.estrela:nth-child(8) {
    left: 60%;
    animation-delay: 1.8s;
}

.estrela:nth-child(9) {
    left: 68%;
    animation-delay: 0.3s;
}

.estrela:nth-child(10) {
    left: 75%;
    animation-delay: 2.2s;
}

.estrela:nth-child(11) {
    left: 82%;
    animation-delay: 1.2s;
}

.estrela:nth-child(12) {
    left: 88%;
    animation-delay: 0.7s;
}

.estrela:nth-child(13) {
    left: 93%;
    animation-delay: 1.7s;
}

.estrela:nth-child(14) {
    left: 25%;
    animation-delay: 2.7s;
}

.estrela:nth-child(15) {
    left: 70%;
    animation-delay: 2.9s;
}

@keyframes queda {
    0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) translateX(150px);
        opacity: 0;
    }
}
</style>
<body>

    <div class="ceu">
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
        <span class="estrela"></span>
    </div>

</body>
</html>
